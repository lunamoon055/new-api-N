name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - alpha
      - nightly
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-supply-chain:
    name: Verify pinned Actions
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Reject mutable action references
        run: |
          if grep -R -E '^[[:space:]]*-[[:space:]]*uses:.*@(v[0-9]|latest|main|master)([[:space:]]|$)' .github/workflows; then
            echo "::error::GitHub Actions must be pinned to a full commit SHA"
            exit 1
          fi

  backend:
    name: Go tests and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Prepare embedded frontend placeholders
        run: |
          mkdir -p web/default/dist web/classic/dist
          printf '%s\n' '<!doctype html><title>CI placeholder</title>' > web/default/dist/index.html
          printf '%s\n' '<!doctype html><title>CI placeholder</title>' > web/classic/dist/index.html

      - name: Verify modules
        run: go mod verify

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Scan reachable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  frontend:
    name: Frontend audit and build (${{ matrix.theme }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme:
          - default
          - classic
    defaults:
      run:
        working-directory: web/${{ matrix.theme }}
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Type-check default frontend
        if: matrix.theme == 'default'
        run: bun run typecheck

      - name: Build
        run: bun run build
