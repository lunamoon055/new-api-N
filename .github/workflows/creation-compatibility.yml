name: creation-compatibility

on:
  pull_request:
    paths:
      - "controller/**"
      - "dto/**"
      - "middleware/**"
      - "model/**"
      - "relay/**"
      - "router/**"
      - "service/**"
      - ".github/workflows/creation-compatibility.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  media-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql, postgres]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: newapi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d newapi_test"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run creation and billing regressions
        run: go test ./model ./middleware ./controller ./router ./service ./relay
        env:
          CREATION_IDEMPOTENCY_TEST_DIALECT: ${{ matrix.database }}
          CREATION_IDEMPOTENCY_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/newapi_test?charset=utf8mb4&parseTime=True&loc=Local
          CREATION_IDEMPOTENCY_POSTGRES_DSN: host=127.0.0.1 user=postgres password=postgres dbname=newapi_test port=5432 sslmode=disable TimeZone=UTC
