# Frontend Development - Backend built from local source
#
# Usage:
#   1. docker compose -f docker-compose.dev.yml up -d
#   2. Open http://localhost:3001 (Rsbuild dev server, API auto-proxied to :3000)
#
# Rebuild backend after Go code changes:
#   docker compose -f docker-compose.dev.yml up -d --build new-api
#
# Stop:
#   docker compose -f docker-compose.dev.yml down
#
# Reset data:
#   docker compose -f docker-compose.dev.yml down -v

services:
  frontend:
    image: oven/bun:1.3.14-alpine
    container_name: new-api-dev-frontend
    restart: unless-stopped
    working_dir: /app
    command:
      - sh
      - -lc
      - bun install --frozen-lockfile && bun run dev --host 0.0.0.0 --port 3001
    ports:
      - "3001:3001"
    volumes:
      - ./web/default:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_REACT_APP_SERVER_URL=http://new-api:3000
      # Docker Desktop bind mounts can miss native file events on macOS.
      - RSBUILD_WATCH_POLL_INTERVAL=500
    depends_on:
      new-api:
        condition: service_started
    networks:
      - dev-network

  new-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: new-api-dev:local
    container_name: new-api-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - dev_data:/data
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://redis
      - TZ=Asia/Shanghai
      - BATCH_UPDATE_ENABLED=true
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    container_name: new-api-dev-redis
    restart: unless-stopped
    networks:
      - dev-network

  postgres:
    image: postgres:15-alpine
    container_name: new-api-dev-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: new-api
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  dev_data:
  dev_pg_data:
  frontend_node_modules:

networks:
  dev-network:
    driver: bridge
